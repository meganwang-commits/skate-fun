<style>
:root{--bg:#fff0f7;--card:#fff;--ink:#111;--mute:#6b4a5c;--acc:#ff5fa8;--grn:#3ddc84;--lab:#0f7a45;--labt:#fff;--line:#111;--shadow:#ff5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1d1d1d;--ink:#f5f5f5;--mute:#d9a9c2;--line:#ff5fa8;--shadow:#3ddc84;--lab:#3ddc84;--labt:#111}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;line-height:1.75;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,#ff5fa8 0 12px,#3ddc84 12px 24px)}
main{max-width:560px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:clamp(1.25rem,5.6vw,1.6rem);margin:0 0 6px;font-weight:900;line-height:1.35}
.title{font-size:clamp(1.7rem,8vw,2.1rem);line-height:1.4}
.title .k{margin-bottom:.1em}
.k{display:inline-block;background:var(--acc);color:#111;padding:0 .35em;font-style:italic;letter-spacing:.04em;transform:skewX(-6deg);margin-right:.2em}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 24px}
.card{background:var(--card);border:3px solid var(--line);border-radius:6px;padding:18px;margin-bottom:22px;box-shadow:5px 5px 0 var(--shadow);animation:rise .7s ease both}
.card:nth-of-type(1){animation-delay:.15s}.card:nth-of-type(2){animation-delay:.3s}.card:nth-of-type(3){animation-delay:.45s}.card:nth-of-type(4){animation-delay:.6s}.card:nth-of-type(5){animation-delay:.75s}
.title,.sub{animation:rise .6s ease both}.sub{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.label{display:inline-block;background:var(--lab);color:var(--labt);font-size:.78rem;font-weight:700;letter-spacing:.12em;padding:1px 10px;margin-bottom:10px}
.today{font-size:1.2rem;font-weight:700;margin:0}
.fl{font-size:2rem;font-weight:900;font-style:italic;line-height:1.3}
.fst{color:var(--acc);letter-spacing:.2em}
.fp{margin:.5em 0 0}
footer{color:var(--mute);font-size:.82rem;text-align:center;margin-top:30px}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

/* 賽道 */
.track{--dw:clamp(72px,22vw,104px);--sky1:#ffe3f1;--sky2:#fff6fb;--gr:#bdf0d3;position:relative;height:calc(var(--dw)*.78 + 96px);background:linear-gradient(var(--sky1),var(--sky2));border:2px solid var(--line);overflow:hidden;margin:12px 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--gr);border-top:3px solid #111}
.sc{position:absolute;font-size:1.5rem;line-height:1;opacity:.9;pointer-events:none;user-select:none}
.sc.g{bottom:26px;font-size:1.7rem}.sc.s{top:8px}
.gate{position:absolute;bottom:22px;width:4px;height:46px;background:repeating-linear-gradient(#ff5fa8 0 8px,#3ddc84 8px 16px);border:1px solid #111;transition:opacity .4s}
.gate b{position:absolute;left:-7px;top:-20px;width:18px;height:18px;line-height:15px;text-align:center;border:2px solid #111;border-radius:50%;background:#fff;color:#111;font-size:.7rem}
.gate.done{opacity:.4}
.fin{position:absolute;right:10px;bottom:20px;font-size:2rem;line-height:1}
.fin.hop{animation:hop .5s ease-in-out 4}
@keyframes hop{50%{transform:translateY(-14px) rotate(8deg)}}
.dog{position:absolute;left:0;bottom:22px;width:var(--dw);padding:0;margin:0;border:0;background:none;cursor:pointer;transition:transform .8s cubic-bezier(.22,.8,.3,1);will-change:transform;z-index:2;touch-action:manipulation;color:inherit;font:inherit}
.dog-in{display:block;width:100%}
.dog-in.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:none}40%{transform:translateY(-28px) rotate(-7deg)}75%{transform:translateY(0) rotate(2deg)}100%{transform:none}}
.dog-in.hopx{animation:hopx .45s ease-out}
@keyframes hopx{40%{transform:translateY(-12px)}100%{transform:none}}
.dogsvg{display:block;width:100%;height:auto;overflow:visible;animation:idle 2.2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-1.5px)}}
.wh{animation:spin .45s linear infinite;animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.tail{animation:wag 1.3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.ear1{animation:ear 5s ease-in-out infinite}.ear2{animation:ear 6.3s ease-in-out 1.7s infinite}
@keyframes ear{0%,90%,100%{transform:none}94%{transform:rotate(-9deg)}}
.speed{opacity:0;transition:opacity .2s}
.rolling .wh{animation-play-state:running}.rolling .speed{opacity:1}.rolling .tail{animation-duration:.4s}
.happy .tail{animation-duration:.22s}
.prop{position:absolute;right:6%;top:-24px;font-size:1.25rem;line-height:1;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.talk .prop{visibility:hidden}
.bubble{position:absolute;bottom:calc(100% + 2px);left:0;white-space:nowrap;background:#fff;color:#111;border:2px solid #111;border-radius:12px;padding:1px 10px;font-size:.85rem;font-weight:700;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .2s}
.talk .bubble{opacity:1}
.puff{position:absolute;bottom:24px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #111;opacity:.9;animation:puff .6s ease-out forwards;pointer-events:none}
@keyframes puff{to{transform:translate(-18px,-8px) scale(1.8);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti s{position:absolute;top:-14px;width:8px;height:12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(240px) rotate(var(--r));opacity:.9}}
.say{min-height:3.6em;margin:8px 0 12px;font-size:1rem}
.row{display:flex;gap:12px}
.btn{flex:1 1 0;min-height:46px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;border:2px solid #111;background:var(--acc);color:#111;padding:8px 18px;box-shadow:3px 3px 0 #111;touch-action:manipulation}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:3px 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 完賽頁 */
#end{text-align:center;padding-top:12vh;overflow:hidden}
#end h1{font-size:1.6rem}
.enddog{position:relative;width:min(62vw,240px);margin:0 auto 22px;animation:rise .8s ease both}
.wavearm{display:none}
.enddog .wavearm{display:inline}.enddog .nearfront{display:none}
.arm{transform-origin:92px 56px}
.enddog .arm{animation:wave .7s ease-in-out .5s infinite}
@keyframes wave{0%,100%{transform:rotate(-72deg)}50%{transform:rotate(-114deg)}}
.bye{position:absolute;right:-6px;top:-26px;background:#fff;color:#111;border:2px solid #111;border-radius:14px;padding:1px 14px;font-weight:700;font-size:1rem;line-height:1.6;white-space:nowrap;animation:rise .6s ease .7s both,bob 1.8s ease-in-out 1.4s infinite}
.endtext{animation:rise .8s ease .5s both}

@media (max-width:420px){.card{padding:15px}.fl{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){
 .dogsvg,.tail,.ear1,.ear2,.prop,.wh,.fin.hop,.dog-in.jump,.dog-in.hopx,.bye,.enddog .arm{animation:none!important}
 .enddog .arm{transform:rotate(-95deg)}
 .dog{transition-duration:.01ms!important}
 .card,.title,.sub,.enddog,.endtext{animation:fade .8s ease both!important}
 .card:nth-of-type(n){animation-delay:.1s}
}
</style>

  const put=(arr,cls,off)=>arr.forEach((c,k)=>{const e=document.createElement('span');e.className='sc '+cls;e.textContent=c;e.setAttribute('aria-hidden','true');e.style.left=(off+k*(78/Math.max(1,arr.length-1)))+'%';if(arr.length===1)e.style.left='50%';scEl.appendChild(e)});
  put(t.gd,'g',8);put(t.sk,'s',16);
}
function enter(){
  pendingEnter=false;dog.style.transition='none';dog.style.transform='translateX(-'+(dog.offsetWidth+40)+'px)';void dog.offsetWidth;dog.style.transition='';
  dog.classList.add('rolling');place();clearTimeout(rollT);rollT=setTimeout(()=>dog.classList.remove('rolling'),950);
}
function resetGame(){
  pos=0;seen=0;pushB.disabled=false;fin.classList.remove('hop');
  track.querySelectorAll('.confetti,.puff').forEach(e=>e.remove());
  say.textContent=THEME.i;place();markGates();
}

function puffs(){
  if(reduce)return;let k=0;
  const iv=setInterval(()=>{
    const r=dog.getBoundingClientRect(),t=track.getBoundingClientRect();
    const e=document.createElement('i');e.className='puff';e.style.left=(r.left-t.left+r.width*.14)+'px';
    track.appendChild(e);e.addEventListener('animationend',()=>e.remove());
    if(++k>=6)clearInterval(iv);
  },110);
}
function celebrate(){
  fin.classList.add('hop');
  if(reduce)return;
  const box=document.createElement('div');box.className='confetti';
  const cols=['#ff5fa8','#3ddc84','#ffffff','#ffd400','#111111'];
  for(let i=0;i<40;i++){const s=document.createElement('s');
    s.style.cssText='left:'+Math.random()*100+'%;background:'+cols[i%5]+';animation-delay:'+Math.random()*.6+'s;animation-duration:'+(1.6+Math.random()*1.2)+'s;--r:'+Math.floor(Math.random()*720-360)+'deg';
    box.appendChild(s)}
  track.appendChild(box);setTimeout(()=>box.remove(),3600);
}
function push(){
  if(pos>=100)return;
  pendingEnter=false;
  pos=Math.min(100,pos+8+Math.floor(Math.random()*5));
  let msg=PUSH[Math.floor(Math.random()*PUSH.length)],crossed=false;
  GATES.forEach((g,i)=>{if(pos>=g[0]&&seen<=i){seen=i+1;msg=g[1];crossed=true}});
  const won=pos>=100;if(won)msg=THEME.w;
  say.textContent=msg;
  dog.classList.add('rolling');place();puffs();
  if(crossed&&!reduce){dogIn.classList.remove('jump','hopx');void dogIn.offsetWidth;dogIn.classList.add('jump')}
  clearTimeout(rollT);rollT=setTimeout(()=>{dog.classList.remove('rolling');markGates()},850);
  if(won){pushB.disabled=true;setTimeout(celebrate,reduce?0:700)}
}
function react(){
  let i;do{i=Math.floor(Math.random()*REACT.length)}while(i===lastReact);lastReact=i;
  bubble.textContent=REACT[i];
  const{W}=geo(),D=dog.offsetWidth,x=X(pos),bw=bubble.offsetWidth;
  let left=D/2-bw/2;left=Math.min(Math.max(left,4-x),W-4-bw-x);bubble.style.left=left+'px';
  dog.classList.add('talk','happy');
  if(!reduce){dogIn.classList.remove('jump','hopx');void dogIn.offsetWidth;dogIn.classList.add('hopx')}
  clearTimeout(talkT);talkT=setTimeout(()=>dog.classList.remove('talk','happy'),1500);
}
pushB.addEventListener('click',push);
resetB.addEventListener('click',resetGame);
dog.addEventListener('click',react);
addEventListener('resize',()=>{place();layoutGates()});

/* 依日期顯示 */
let lastIdx=null;
function applyDate(d){
  const idx=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-START)/864e5);
  const over=idx>LAST;
  $('live').hidden=over;$('end').hidden=!over;
  if(over){lastIdx=idx;return}
  const n=Math.max(0,idx);lastIdx=idx;
  $('today').textContent=LINES[n%LINES.length];
  $('tv').textContent=TRIVIA[n%TRIVIA.length];
  $('mm').textContent=MEMES[(n*5+3)%MEMES.length];
  const lv=pk(LV,n,5),st=STARS[lv],S=(id,v)=>{$(id).textContent=v};
  S('fl',lv);S('fs','★'.repeat(st)+'☆'.repeat(5-st));S('fy',pk(YI,n,7));S('fj',pk(JI,n,3));S('fi',pk(LI,n,5));S('fc',pk(LC,n,1));
  setTheme(THEMES[n%THEMES.length]);
  resetGame();layoutGates();
}
window.applyDate=applyDate;

const q=new URLSearchParams(location.search).get('date');
let fixed=null;
if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)){const p=q.split('-');fixed=new Date(+p[0],+p[1]-1,+p[2],12)}
if(!reduce&&'IntersectionObserver' in window){
  pendingEnter=true;dog.style.transition='none';dog.style.transform='translateX(-300px)';
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();enter()}},{threshold:.5});io.observe(track);
}
applyDate(fixed||new Date());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||fixed)return;
  const d=new Date(),idx=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-START)/864e5);
  if(idx!==lastIdx)applyDate(d);
});
})();
</script>
